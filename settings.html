<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ApexScan - Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: "Segoe UI", sans-serif; }
        body {
            background: linear-gradient(180deg, #d8d8ec 0%, #e6dcdd 60%, #f2dcd7 100%);
            display: flex;
            justify-content: center;
        }

        .page {
            width: 550px;
            padding: 24px;
        }

        h1 { font-size: 28px; color: #444; margin-bottom: 20px; }

        .back-link {
            display: inline-block;
            font-size: 14px;
            color: #4a90d9;
            text-decoration: none;
            margin-bottom: 16px;
        }
        .back-link:hover { text-decoration: underline; }

        .config-section {
            margin: 20px 0;
            padding: 14px;
            background: white;
            border: 1px solid #ccc;
        }
        .section-title {
            font-size: 15px;
            color: #333;
            font-weight: 700;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #444;
            margin: 12px 0 6px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #4a90d9;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0px 2px 2px 0px rgba(0, 0, 0, 0.25);
        }
        .save-btn:hover { opacity: 0.9; }

        .status {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            min-height: 18px;
            color: #444;
        }

        .test-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .test-btn {
            padding: 9px 18px;
            font-size: 14px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            color: #333;
            box-shadow: 0px 2px 2px 0px rgba(0, 0, 0, 0.25);
        }

        .test-btn:hover:not(:disabled) {
            border-color: #4a90d9;
            color: #4a90d9;
        }

        .test-btn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .test-status {
            font-size: 14px;
            min-height: 18px;
        }

        .test-status.ok {
            color: #28a745;
        }

        .test-status.fail {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="page">
        <a class="back-link" id="backBtn" href="index.html" target="_blank">← Back to ApexScan</a>
        <h1>Settings</h1>

        <div class="config-section">
            <div class="section-title">Server URL</div>
            <label for="serverUrl">JSON server address (search &amp; snapshots):</label>
            <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8000" value="http://127.0.0.1:8000">
            <div class="status" style="text-align:left;">
                Search queries and snapshots are sent to this address (<em>GET /api/search?q=</em>, <em>POST /api/add-snap</em>).
            </div>
        </div>

        <div class="test-row">
            <button id="testBtn" class="test-btn">Test connection</button>
            <span id="testStatus" class="test-status"></span>
        </div>

        <button id="saveBtn" class="save-btn">Save Settings</button>
        <div class="status" id="saveStatus"></div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
