<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ApexShot — Snapshot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
        body { background: #f6f7f9; padding: 24px 16px 48px; color: #24292f; }
        .page { width: 900px; max-width: 96%; margin: 0 auto; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .back-link { font-size: 14px; color: #2563eb; text-decoration: none; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }
        #snapId { font-size: 12px; color: #57606a; word-break: break-all; text-align: right; }
        .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 0; padding: 22px 26px; margin-bottom: 18px; }
        h1 { font-size: 22px; line-height: 1.3; word-break: break-word; }
        .subtitle { font-size: 13px; color: #57606a; margin-top: 8px; word-break: break-all; }
        .subtitle a { color: #1a7f37; text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 0; background: #f0f0f5; color: #555; }
        .badge-type { background: #dbeafe; color: #1d4ed8; }
        .badge-conf-high { background: #dcfce7; color: #15803d; }
        .badge-conf-mid { background: #fef9c3; color: #a16207; }
        .badge-conf-low { background: #fee2e2; color: #b91c1c; }
        .thumb { max-width: 100%; border-radius: 0; margin-top: 14px; border: 1px solid #e1e4e8; }
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e1e4e8; overflow-x: auto; margin-bottom: 18px; }
        .tab-btn { padding: 10px 16px; font-size: 14px; background: none; border: none; border-bottom: 2px solid transparent; color: #57606a; cursor: pointer; white-space: nowrap; }
        .tab-btn:hover { color: #24292f; }
        .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #57606a; margin: 20px 0 8px; }
        .section-title:first-child { margin-top: 0; }
        .summary-text { color: #24292f; line-height: 1.65; font-size: 14px; white-space: pre-wrap; }
        .snap-section { background: #f6f7f9; border: 1px solid #e1e4e8; border-radius: 0; padding: 14px 16px; margin-bottom: 10px; }
        .snap-section h4 { font-size: 14px; margin-bottom: 6px; }
        .snap-section p { font-size: 13px; color: #57606a; line-height: 1.6; white-space: pre-wrap; }
        .questions { margin-left: 18px; font-size: 14px; line-height: 1.7; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: #f0f0f5; color: #555; font-size: 12px; padding: 4px 10px; border-radius: 0; }
        table.facts { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.facts th { text-align: left; font-size: 11px; text-transform: uppercase; color: #57606a; background: #f6f7f9; padding: 8px 10px; border-bottom: 1px solid #e1e4e8; }
        table.facts td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        .quote { color: #57606a; font-style: italic; max-width: 340px; }
        .claim { max-width: 320px; }
        .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 0; white-space: nowrap; }
        .pill-ok { background: #dcfce7; color: #15803d; }
        .pill-warn { background: #fef9c3; color: #a16207; }
        .highlight { background: #f6f7f9; border: 1px solid #e1e4e8; border-radius: 0; padding: 14px 16px; margin-bottom: 10px; }
        .highlight p { font-style: italic; line-height: 1.6; font-size: 14px; }
        .highlight .reason { font-style: normal; font-size: 12px; color: #57606a; margin-top: 6px; }
        .entity-group { background: #f6f7f9; border: 1px solid #e1e4e8; border-radius: 0; padding: 12px 14px; margin-bottom: 10px; }
        .entity-group h4 { font-size: 12px; text-transform: uppercase; color: #57606a; margin-bottom: 8px; }
        .entity-empty { color: #aaa; font-size: 13px; }
        .raw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .raw-btn { border: 1px solid #e1e4e8; background: #fff; padding: 6px 14px; border-radius: 0; font-size: 13px; cursor: pointer; }
        .raw-btn:hover { border-color: #2563eb; color: #2563eb; }
        #copyMsg { font-size: 12px; color: #1a7f37; }
        pre.raw { background: #f6f7f9; border: 1px solid #e1e4e8; border-radius: 0; padding: 16px; font-size: 12px; line-height: 1.5; max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
        .status { padding: 48px 0; text-align: center; color: #57606a; font-size: 14px; }
        .status.error { color: #a40e0e; }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="#" id="backBtn" class="back-link">&larr; Back to search</a>
            <span id="snapId"></span>
        </div>
        <div id="status" class="status">Loading snapshot…</div>
        <div id="content" style="display:none;">
            <div class="card">
                <h1 id="title"></h1>
                <div class="subtitle" id="subtitle"></div>
                <div class="badges" id="badges"></div>
                <img id="thumb" class="thumb" alt="Thumbnail" style="display:none;">
            </div>
            <div class="card">
                <div class="tabs" id="tabs"></div>
                <div id="panels"></div>
            </div>
        </div>
    </div>
    <script src="viewer.js"></script>
</body>
</html>
