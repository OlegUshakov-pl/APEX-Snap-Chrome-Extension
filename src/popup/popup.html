<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ApexShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1 class="brand">ApexShot</h1>
    <button id="optionsBtn" class="icon-btn" title="Настройки" aria-label="Настройки">&#9881;</button>
  </header>

  <div id="statusBanner" class="banner hidden" role="status"></div>
  <div id="degradedBanner" class="banner warning hidden" role="status">
    Ollama недоступен — результаты только полнотекстовые
  </div>

  <div class="search-bar">
    <input id="queryInput" type="text" placeholder="Поиск по слепкам..." autocomplete="off" autofocus>
    <button id="searchBtn">Искать</button>
  </div>

  <div id="message" class="message hidden"></div>
  <div id="results" class="results"></div>

  <template id="resultTemplate">
    <div class="result-card">
      <div class="result-title-row">
        <a class="result-title"></a>
        <button class="open-source" title="Открыть источник в новой вкладке">Открыть источник</button>
      </div>
      <div class="result-meta">
        <span class="result-score"></span>
        <span class="result-fields"></span>
      </div>
      <div class="result-snippet"></div>
    </div>
  </template>

  <script src="popup.js"></script>
</body>
</html>
