<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ApexScan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: "Segoe UI", sans-serif;
        }

        /* Soft purple -> pink gradient like the screenshot */
        body {
            background: linear-gradient(180deg, #d8d8ec 0%, #e6dcdd 60%, #f2dcd7 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Add "+" menu to the left */
        #menuBtn {
            position: fixed;
            top: 16px;
            left: 24px;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #666;
            z-index: 10;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        #menuBtn:hover {
            color: #0078D4;
        }

        /* Dropdown menu for "+" button */
        .dropdown-menu {
            position: fixed;
            top: 56px;
            left:         24px;
            width: 100px;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .dropdown-menu.hidden {
            display: none;
        }

        .menu-item {
            padding: 10px 15px;
            font-size: 16px;
            color: #333;
            text-decoration: none;
            cursor: pointer;
            line-height: 1.8;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            font-weight: bold;
        }

        /* Smooth fade for dropdown */
        .dropdown-container {
            position: fixed;
            top: 56px;
            left: 24px;
            width: 150px;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .dropdown-container.visible {
            opacity: 1;
        }

        .dropdown-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Centered search bar */
        .search-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 12vh;
        }

        #searchBar {
            width: 720px;
            max-width: 90%;
            height: 56px;
            background: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 14px;
        }

        #searchBar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            background: transparent;
        }

        #searchBar input::placeholder {
            color: #999;
        }

        /* Search results (hidden until a query is submitted) */
        #results {
            display: none;
            width: 720px;
            max-width: 90%;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            padding: 20px 24px;
            overflow: auto;
            max-height: 60vh;
        }

        #results .result-item {
            padding: 12px 0;
            border-bottom: 1px solid #e5e0e6;
        }

        #results .result-item:last-child {
            border-bottom: none;
        }

        #results .result-title {
            color: #0078D4;
            font-size: 15px;
            text-decoration: none;
        }

        #results .result-url {
            color: #28a745;
            font-size: 12px;
            margin: 2px 0 4px;
        }

        #results .result-snippet {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
        }

        #results .result-empty {
            color: #777;
            text-align: center;
            padding: 24px 0;
            font-size: 14px;
        }

        /* Loading spinner state */
        #searchBar.loading .search-icon {
            opacity: 0.3;
        }

        .search-icon {
            font-size: 18px;
            color: #0078D4;
        }

        #searchError {
            display: none;
            margin-top: 12px;
            color: #dc3545;
            font-size: 13px;
            text-align: center;
        }

        /* Settings gear - top-right corner, no background */
        .settings-btn {
            position: fixed;
            top: 16px;
            right: 24px;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            color: #666;
        }

        /* Settings gear - no background, top-right corner */
        #settingsBtn {
            position: fixed;
            top: 16px;
            right: 24px;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #settingsBtn:hover {
            transform: rotate(90deg);
        }

        #settingsBtn svg {
            width: 24px;
            height: 24px;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Menu "+" button on the left -->
    <button id="menuBtn">+</button>
    <div class="dropdown-container hidden" id="menuContainer">
        <div class="dropdown-menu hidden" id="menuList">
            <a href="new_file.html" class="menu-item">New File</a>
            <a href="list_files.html" class="menu-item">File List</a>
        </div>
    </div>

    <!-- Settings gear (opens settings page via index.js) -->
    <a href="#"
         id="settingsBtn"
         title="Settings"
         aria-label="Settings"
         class="settings-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </a>

    <!-- Search bar -->
    <div class="search-wrapper">
        <div>
            <div id="searchBar">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search on ApexScan" autocomplete="off" autofocus>
            </div>
            <div id="searchError"></div>
            <div id="results"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
