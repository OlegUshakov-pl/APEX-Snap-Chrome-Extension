<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ApexScan</title>
    <style>
        body { width: 320px; padding: 15px; font-family: sans-serif; background-color: #f0f2f5; }
        h3 { margin-top: 0; color: #333; }

        /* Buttons */
        button {
            width: 100%; padding: 10px; margin-top: 8px; cursor: pointer;
            background: #0078D4; color: white; border: none; border-radius: 5px;
            font-size: 13px;
        }
        button:hover { opacity: 0.9; }

        /* Server selection with lamp indicators */
        .server-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .server-btn {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            color: #333;
        }
        button.server-btn { width: auto; margin-top: 0; }
        .server-btn.active {
            background: #0078D4;
            color: white;
            border-color: #0078D4;
        }

        /* Lamp indicators */
        .lamp-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #999;
        }
        .lamp-green { background-color: #28a745; box-shadow: 0 0 5px #28a745; }
        .lamp-red { background-color: #dc3545; box-shadow: 0 0 5px #dc3545; }
        .lamp-yellow { background-color: #ffc107; box-shadow: 0 0 5px #ffc107; }

        /* Configuration */
        label { display: block; margin-top: 8px; font-size: 12px; color: #444; }
        input[type="text"], select {
            width: 100%; padding: 7px; margin-top: 4px;
            border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
        }

        /* Server URL readout */
        .server-url {
            margin-top: 8px; font-size: 11px; color: #555;
            background: white; padding: 6px 8px; border-radius: 4px;
            word-break: break-all;
        }

        /* Status */
        .status { margin-top: 10px; font-size: 12px; text-align: center; min-height: 20px; }

        /* Available models display */
        .models-list {
            font-size: 11px;
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            max-height: 200px;
            overflow: auto;
        }

        /* AI result display */
        .result { font-size: 11px; background: white; padding: 8px; border-radius: 4px; margin-top: 8px; max-height: 150px; overflow: auto; }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 10px;">
        <img src="assets/logo.png" alt="Apex Scan" style="height: 28px; vertical-align: middle;">
    </div>

    <!-- Server selection with lamp indicators in one row -->
    <div class="server-row">
        <span class="lamp-indicator lamp-yellow" id="ollamaLamp"></span>
        <button id="ollamaBtn" class="server-btn active">Ollama</button>
        <span class="lamp-indicator lamp-yellow" id="lmstudioLamp"></span>
        <button id="lmstudioBtn" class="server-btn">LM Studio</button>
        <button id="refreshBtn" class="server-btn">Refresh</button>
    </div>

    <!-- Snapshot generation button -->
    <button id="snapBtn">Generate Snapshot (Free)</button>

    <!-- Folder analysis button -->
    <button id="folderBtn" style="width:100%; padding: 8px; margin-top: 8px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 5px; font-size: 12px;">Analyze Folder</button>

    <!-- Status -->
    <div class="status" id="status">Ready...</div>

    <!-- AI analysis result -->
    <div class="result" id="aiResult"></div>

    <!-- AI server configuration -->
    <div class="config-section">
        <label id="aiPortLabel" for="aiPort">Ollama port:</label>
        <input type="text" id="aiPort" placeholder="11434 (Ollama) / 1234 (LM Studio)" value="11434" />

        <label id="modelLabel" for="modelSelect">Model (for Ollama):</label>
        <select id="modelSelect">
            <option value="">Select a model...</option>
        </select>
    </div>

    <!-- JSON server address (set on the settings page) -->
    <div class="server-url">Server URL: <span id="serverUrlText">…</span></div>

    <!-- Available models from both AI servers -->
    <div class="models-list" id="availableModels">
        <em>Scanning for models...</em>
    </div>

    <!-- Scripts -->
    <script src="ai-service.js"></script>
    <script src="popup.js"></script>
</body>
</html>
